spring:
  application:
    name: pipeline-service

  # SPRING_DATASOURCE_URL / _USERNAME / _PASSWORD are injected per service by docker-compose,
  # never through a shared env_file (NFR-14: least privilege for secrets).
  datasource:
    hikari:
      # NFR-05: ai_call_log is written in its own REQUIRES_NEW transaction while the chunk
      # transaction is still open, so the pool must hold a second connection per running job.
      maximum-pool-size: 10

  servlet:
    multipart:
      # AC-01.4: both limits follow PIPELINE_MAX_UPLOAD_MB, so the multipart overhead counts too.
      max-file-size: ${PIPELINE_MAX_UPLOAD_MB:50}MB
      max-request-size: ${PIPELINE_MAX_UPLOAD_MB:50}MB

  flyway:
    enabled: true
    locations: classpath:db/migration

  batch:
    jdbc:
      # BATCH_* tables come from Flyway V1, never from Spring Batch itself (docs/05 section 1).
      initialize-schema: never
    # Boot would otherwise launch every job at startup, without the parameters a batch needs.
    job:
      enabled: false

pipemend:
  inbox-dir: /data/inbox
  chunk-size: ${PIPELINE_CHUNK_SIZE:100}

server:
  port: 8080
  tomcat:
    # Tomcat rejects an oversized upload from its Content-Length and, past 2 MB of unread body, closes the connection
    # while the client is still sending: many clients then never see the 413 (AC-01.4). This reads and discards it.
    max-swallow-size: -1

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      # The MVP has no authentication (docs/01 X-02) and health exposes nothing secret.
      show-details: always
      probes:
        enabled: true

# NFR-08: structured JSON logs on stdout. In Boot 4 this is configuration, not code.
# The ecs format carries service.name from spring.application.name; batchId, requestId and
# sourceRowNumber are added through the MDC from Sprint 2 on.
logging:
  structured:
    format:
      console: ecs
  level:
    root: INFO
    com.pipemend: INFO
